name: Repository contract

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate project and task state
        run: python3 tools/project.py check
      - name: Validate the shell runner
        run: bash -n tools/run.sh
      - name: Compile the metadata tool
        run: PYTHONPYCACHEPREFIX=/tmp/polyglot-pycache python3 -m py_compile tools/project.py
