[package]
name = "polyglot-rust-harness"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false
autotests = false
build = "build.rs"

[features]
default = []
pedagogy = []

[lib]
path = "src/lib.rs"

[[bin]]
name = "course-probe"
path = "src/bin/course_probe.rs"
test = false

[[test]]
name = "course"
path = "tests/course.rs"

[[test]]
name = "harness"
path = "tests/harness.rs"
